<!doctype html>
<html><head><meta charset="utf-8"></head>
<body><div id="step-once">refused the first time</div>
<script>
  // The first lookup of this selector throws, so the first masking pass fails and a retry succeeds.
  const original = Document.prototype.querySelectorAll;
  let calls = 0;
  Document.prototype.querySelectorAll = function (selector) {
    if (selector === "#step-once" && calls++ === 0) throw new SyntaxError("refused once");
    return original.call(this, selector);
  };
</script>
</body></html>
