<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Masking fixture kim@example.com</title>
<style>
  body { margin: 0; font: 16px sans-serif; background: #fff; }
  .box { position: absolute; left: 20px; width: 300px; height: 30px; background: #fff; color: #000; }
  iframe { position: absolute; left: 20px; top: 180px; width: 300px; height: 60px; border: 0; }
</style>
</head>
<body>
  <div id="email" class="box" style="top:20px">kim@example.com</div>
  <div id="site" class="box private" style="top:60px">Hidden by selector</div>
  <div id="shadow" class="box" style="top:140px"></div>
  <iframe id="frame" src="/mask-frame.html"></iframe>
  <div id="plain" class="box" style="top:260px">Order 12345678</div>
  <input id="password" class="box" style="top:300px" type="password" value="pa55word">
  <div id="step" class="box" style="top:340px">Step mask area</div>
  <input id="typed" class="box" style="top:380px" type="text">
  <a id="open-popup" href="/mask.html" target="_blank" style="position:absolute;left:400px;top:20px">open</a>
  <script>
    document.getElementById("shadow").attachShadow({ mode: "open" }).innerHTML = "<span style=\"display:block;height:30px\">+82 10 1234 5678</span>";
    setTimeout(() => {
      const late = document.createElement("div");
      late.id = "late";
      late.className = "box";
      late.style.top = "100px";
      late.textContent = "010-1234-5678";
      document.body.append(late);
    }, 400);
  </script>
</body>
</html>
