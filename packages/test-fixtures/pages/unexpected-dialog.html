<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Unexpected dialog</title></head>
<body>
<h1>Unexpected dialog</h1>
<button id="surprise" type="button">Surprise</button>
<script>
  document.getElementById("surprise").addEventListener("click", () => alert("Surprise"));
</script>
</body>
</html>
