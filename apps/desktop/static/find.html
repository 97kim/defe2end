<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'" />
    <link rel="stylesheet" href="./find.css" />
  </head>
  <body>
    <div class="bar">
      <input id="text" type="text" spellcheck="false" autocomplete="off" />
      <span id="count" role="status"></span>
      <button id="previous" type="button">↑</button>
      <button id="next" type="button">↓</button>
      <button id="close" type="button">✕</button>
    </div>
    <script src="./find.js"></script>
  </body>
</html>
